    name: Build APK
    on:
      workflow_dispatch:
      push:
        branches: [main, master]

    jobs:
      build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: "17"
          - uses: subosito/flutter-action@v2
            with:
              channel: stable
              cache: true
          - name: Create Android project
            run: flutter create --org com.jdsoftware --project-name case_diary --platforms android .
          - name: Apply Android config
            run: dart run tools/apply_android_config.dart
          - name: Get packages
            run: flutter pub get
          - name: Run tests
            run: flutter test
            continue-on-error: true
          - name: Build release APK
            run: flutter build apk --release
          - uses: actions/upload-artifact@v4
            with:
              name: case-diary-apk
              path: build/app/outputs/flutter-apk/app-release.apk
