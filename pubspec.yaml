   name: Build APK
   on:
     workflow_dispatch:
     push:
       branches: [main, master]

   jobs:
     build:
       runs-on: ubuntu-latest
       timeout-minutes: 45
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: "17"
         - uses: subosito/flutter-action@v2
           with:
             channel: stable
             cache: true
         - name: Create Android project
           run: flutter create --org com.jdsoftware --project-name case_diary --platforms android .
         - name: Apply Android config
           run: dart run tools/apply_android_config.dart
         - name: Relax Kotlin target check
           run: echo "kotlin.jvm.target.validation.mode=IGNORE" >> android/gradle.properties
         - name: Force newer compileSdk on old plugins
           run: |
             cat > /tmp/fix.kts <<'EOF'
             subprojects {
                 plugins.withId("com.android.library") {
                     val ext = extensions.findByName("android")
                     if (ext != null) {
                         try {
                             ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                         } catch (e: Exception) {
                             println("compileSdk override skipped: " + e)
                         }
                     }
                 }
             }
             EOF
             cat /tmp/fix.kts android/build.gradle.kts > /tmp/new.kts
             mv /tmp/new.kts android/build.gradle.kts
         - name: Get packages
           run: flutter pub get
         - name: Run tests
           run: flutter test
           continue-on-error: true
         - name: Build release APK
           run: flutter build apk --release
         - uses: actions/upload-artifact@v4
           with:
             name: case-diary-apk
             path: build/app/outputs/flutter-apk/app-release.apk
